name: Publicar Nova Versão (Instalador)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_version:
        description: 'Versão para publicar (ex: v1.0.1)'
        required: true
        default: 'v1.0.1'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Compilar aplicativo e gerar Instalador-ContasAPagar.zip
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File .\build.ps1

      - name: Publicar Release no GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name != 'master' && github.ref_name != 'main' && github.ref_name || inputs.tag_version }}
          name: "Atualização ${{ github.ref_name != 'master' && github.ref_name != 'main' && github.ref_name || inputs.tag_version }}"
          generate_release_notes: true
          files: |
            dist/Instalador-ContasAPagar.zip
            dist/ContasAPagar.exe
            dist/instalador.exe
